<style>
  :root {
    --azul: #0A2540;
    --azul-med: #1A3F6F;
    --azul-claro: #2E6FBF;
    --verde: #1DB87A;
    --cinza-fundo: #F0F4F8;
    --cinza-borda: #D0D9E4;
    --cinza-texto: #4A5568;
    --texto-escuro: #1A2535;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--cinza-fundo);
    color: var(--texto-escuro);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .wrap {
    width: 100%;
    max-width: 420px;
  }

  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 40px;
  }
  .brand img {
    width: 40px; height: 40px;
    object-fit: contain;
    border-radius: 8px;
  }
  .brand span {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--azul-med);
    text-transform: uppercase;
  }

  h1 {
    text-align: center;
    font-size: 19px;
    font-weight: 800;
    color: var(--azul);
    margin-top: -20px;
    margin-bottom: 30px;
  }

  .cards {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: white;
    border: 1px solid var(--cinza-borda);
    border-left: 5px solid var(--azul-claro);
    border-radius: 12px;
    padding: 20px 18px;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 2px 8px rgba(10,37,64,0.06);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .card:active {
    transform: scale(0.98);
  }
  .card-info { flex: 1; min-width: 0; }
  .card-info .titulo {
    font-size: 16px;
    font-weight: 700;
    color: var(--texto-escuro);
  }
  .card-info .desc {
    font-size: 12px;
    color: var(--cinza-texto);
    margin-top: 2px;
  }
  .card-arrow {
    color: var(--azul-claro);
    font-size: 22px;
    flex-shrink: 0;
  }

  footer {
    margin-top: 34px;
    text-align: center;
    font-size: 11px;
    color: #8094AC;
  }
</style>
</head>
